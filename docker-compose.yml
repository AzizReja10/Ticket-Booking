services:
  postgres:
    image: postgres:16
    container_name: flash-postgres
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash123
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: flash-redis
    ports:
      - "6379:6379"
  nginx:
    image: nginx:1.27
    container_name: flash-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"